spring:
  application:
    name: identidad

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:distrinubs}
    username: ${DB_USER:distrinubs}
    password: ${DB_PASSWORD:distrinubs}

  flyway:
    out-of-order: true
    ignore-migration-patterns: "*:missing,*:future"

identidad:
  jwt:
    secreto: ${JWT_SECRETO}
    duracion-segundos: ${JWT_DURACION_SEGUNDOS:86400}

siembra:
  activa: ${SIEMBRA_ACTIVA:true}
  cuentas-carga: ${SIEMBRA_CUENTAS_CARGA:0}
  contrasena-demo: ${SIEMBRA_CONTRASENA_DEMO}
  contrasena-admin: ${SIEMBRA_CONTRASENA_ADMIN}

server:
  port: ${PORT:8083}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_CLIENT_ENABLED:true}
    fetch-registry: ${EUREKA_CLIENT_ENABLED:true}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info
