spring:
  application:
    name: identidad

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:distrinubs}
    username: ${DB_USER:distrinubs}
    password: ${DB_PASSWORD:distrinubs}

  flyway:
    out-of-order: true

identidad:
  jwt:
    secreto: ${JWT_SECRETO:distrinubs-secreto-compartido-etapa-02-separacion-2027}
    duracion-segundos: ${JWT_DURACION_SEGUNDOS:86400}

siembra:
  activa: ${SIEMBRA_ACTIVA:true}
  cuentas-carga: ${SIEMBRA_CUENTAS_CARGA:0}
  contrasena-demo: ${SIEMBRA_CONTRASENA_DEMO:distrinubs}

server:
  port: ${IDENTIDAD_PUERTO:8083}

eureka:
  client:
    enabled: ${EUREKA_ACTIVO:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
