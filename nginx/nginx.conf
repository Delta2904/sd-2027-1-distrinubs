# Balanceador de entrada de la etapa 02-separacion.
#
# Es el único contenedor de la aplicación con un puerto publicado: todo entra
# por aquí. Reparte las peticiones entre las réplicas del gateway, mandando
# cada una a la réplica con menos conexiones activas, y entrega el front.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # DNS interno de Docker. Con `resolve` en cada servidor, nginx vuelve a
    # preguntar cada 5 s: deja de usar la dirección de una réplica que ya no
    # existe y empieza a usar la de una que se agregó o se reinició.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Id de correlación: se respeta el que manda el cliente. Si no trae, se genera.
    map $http_x_correlation_id $id_correlacion {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    # El registro dice a qué contenedor fue cada petición: así se ve el reparto.
    log_format entrada '$remote_addr [$time_iso8601] "$request" $status '
                       'destino=$upstream_addr tiempo=${request_time}s id=$id_correlacion';
    access_log /var/log/nginx/access.log entrada;

    upstream gateways {
        zone gateways 64k;
        least_conn;
        # Una réplica que no contesta se deja de usar 10 s y después se vuelve a probar.
        server gateway:8080 resolve max_fails=1 fail_timeout=10s;
    }

    upstream front {
        zone front 64k;
        server app:8080 resolve;
    }

    server {
        listen 80;
        server_name _;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id  $id_correlacion;
        # Una conexión por petición: no se reutiliza una conexión hacia una réplica que ya murió.
        proxy_set_header Connection        close;

        proxy_connect_timeout 1s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # Si una réplica no contesta (conexión rechazada, cortada o sin respuesta
        # a tiempo), la petición pasa a la otra. Un 502 o un 503 que responde el
        # gateway no cuenta: avisa de una falla detrás del gateway (por ejemplo,
        # `identidad` caída), no de la réplica, y reintentarlo marcaría como
        # caídas a réplicas que están sanas. Un POST que ya se envió no se repite.
        proxy_next_upstream         error timeout;
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 5s;

        # Para el healthcheck del contenedor.
        location = /salud-nginx {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # El front y la vista del estado de los servicios los sirve el contenedor
        # `app`. Cada ruta es exacta y llega a `app` con una ruta fija: por aquí
        # no se alcanza ninguna otra ruta de ese contenedor.
        location = /                          { proxy_pass http://front/; }
        location = /index.html                { proxy_pass http://front/index.html; }
        location = /app.js                    { proxy_pass http://front/app.js; }
        location = /estilos.css               { proxy_pass http://front/estilos.css; }
        location = /favicon.ico               { proxy_pass http://front/favicon.ico; }
        location = /api/observabilidad/estado { proxy_pass http://front/api/observabilidad/estado; }

        # Todo lo demás va a las réplicas del gateway, que valida el token y
        # encuentra a cada servicio en el directorio.
        location / {
            proxy_pass http://gateways;
        }
    }
}
