# Etapa 01-monolito: una aplicación y una base PostgreSQL en una computadora.
# Se levanta con `docker compose up` y se entra por http://localhost:8080.
# Las credenciales son solo para uso local.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: distrinubs
      POSTGRES_USER: distrinubs
      POSTGRES_PASSWORD: distrinubs
    volumes:
      # Volumen persistente: los envíos y resultados sobreviven a un reinicio.
      - distrinubs_datos:/var/lib/postgresql/data
    ports:
      # Solo para revisar la base desde la computadora (psql, DBeaver).
      # Si el 5432 ya está ocupado: DB_PUERTO_LOCAL=5433 docker compose up
      - "127.0.0.1:${DB_PUERTO_LOCAL:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distrinubs -d distrinubs"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: distrinubs
      DB_USER: distrinubs
      DB_PASSWORD: distrinubs
    depends_on:
      # La aplicación arranca cuando la base ya acepta conexiones, no antes.
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  distrinubs_datos:
