spring:
  application:
    name: distrinubs

  # En Docker Compose, las variables DB_* las pone docker-compose.yml.
  # Los valores por omisión sirven para correr la aplicación fuera de Docker
  # contra la base del contenedor.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:distrinubs}
    username: ${DB_USER:distrinubs}
    password: ${DB_PASSWORD:distrinubs}

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea Flyway. Hibernate solo revisa al
      # arrancar que las entidades coincidan con las tablas.
      ddl-auto: validate

  flyway:
    # Migraciones con fecha y hora, escritas por cada dueño en paralelo:
    # una versión más vieja que llega después se aplica.
    out-of-order: true

# Siembra automática al arrancar: cada módulo dueño carga sus datos de demo.
siembra:
  activa: true
  # Cuentas extra para la prueba de carga (carga001, carga002, ...). 0 = ninguna.
  cuentas-carga: ${SIEMBRA_CUENTAS_CARGA:0}

# Workers de evaluación.
evaluacion:
  activa: true
  python: python3
  # Hilos que evalúan dentro de la misma aplicación, sobre la misma cola.
  workers: ${EVALUACION_WORKERS:2}
  # Veces que se toma un envío antes de darlo por no evaluable (ERROR_SERVIDOR).
  # Cuenta toda toma sin resultado; no penaliza al alumno.
  max-tomas: 3
  intervalo-ms: 1000
  # Salvaguarda provisional: todavía no hay un tope de compilación definido.
  salvaguarda-compilacion-ms: 10000
  margen-lease-ms: 10000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
